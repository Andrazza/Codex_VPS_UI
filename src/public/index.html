<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Codex Desk</title><link rel="stylesheet" href="/styles.css"></head><body><main class="app"><header class="top"><a class="brand" href="/"><b>C</b><span>Codex Desk</span></a><span class="online"><i></i><span id="connection">На связи</span></span></header><section class="limits"><div class="limit"><span>5 часов</span><strong id="limit-five">—</strong></div><div class="limit"><span>Неделя</span><strong id="limit-week">—</strong></div><button id="usage-refresh" class="refresh" aria-label="Обновить лимиты">↻</button><p id="usage-updated"></p></section><section class="workspace"><select id="project" disabled><option>Загрузка папок…</option></select><div class="project-meta"><span id="branch">—</span><span id="status">—</span><button id="refresh" type="button">Обновить</button></div><p id="path" hidden></p></section><section class="conversation"><div class="chat-top"><span>Модель</span><select id="model" disabled><option>Загрузка…</option></select><select id="effort" disabled aria-label="Глубина анализа"><option>—</option></select></div><div id="messages" class="messages"><div class="empty-state"><h1>Новая задача</h1><p>Напишите, что нужно сделать в выбранной папке.</p></div></div><p id="chat-status"></p><form id="composer" class="composer"><textarea id="prompt" disabled rows="3" placeholder="Что нужно сделать?"></textarea><button id="send" disabled aria-label="Отправить">↑</button><button id="stop" type="button" hidden>Стоп</button></form></section></main><script type="module" src="/app.js"></script></body></html>
