<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f5fc"><title>Codex Desk</title><link rel="stylesheet" href="/styles.css"></head><body><main class="app"><header class="top"><a class="brand" href="/"><b>C</b><span>Codex Desk</span></a><span class="online"><i></i>На связи</span></header><section class="limits card"><div class="section-title">Лимиты Codex <button id="usage-refresh" class="refresh">↻</button></div><div class="limit-grid"><div class="limit"><span>Осталось на 5 часов</span><strong id="limit-five">—</strong></div><div class="limit"><span>Осталось на неделю</span><strong id="limit-week">—</strong></div></div><p id="usage-updated"></p></section><section class="workspace card"><div class="section-title">Проект <button id="refresh" type="button">Обновить</button></div><select id="project" disabled><option>Загрузка проектов…</option></select><div class="project-meta"><span id="branch">—</span><span id="status">—</span></div><details><summary>Подключить GitHub-проект</summary><form id="clone-form"><label>Ссылка SSH или HTTPS</label><div class="clone-row"><input id="clone-url" placeholder="git@github.com:владелец/проект.git"><button>Добавить</button></div><p id="clone-status"></p></form></details></section><section class="conversation card"><div class="chat-top"><span>Модель</span><select id="model" disabled><option>Загрузка…</option></select><select id="effort" disabled><option>—</option></select></div><div id="messages" class="messages"><div class="empty-state"><h1>Новая задача</h1><p>Выберите проект и напишите, что нужно сделать.</p></div></div><p id="chat-status"></p><form id="composer" class="composer"><textarea id="prompt" disabled rows="3" placeholder="Что нужно сделать?"></textarea><button id="send" disabled>↑</button><button id="stop" type="button" hidden>Остановить</button></form></section></main><script type="module" src="/app.js"></script></body></html>
